<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos | Pymedesk</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main><header><div><small>PYMEDESK</small><h1>Gestión de pedidos</h1><p>Consulta y actualiza el estado de los pedidos.</p></div><span id="count"></span></header>
<div id="error" role="alert"></div>
<section><div class="scroll"><table><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="orders"><tr><td colspan="5">Cargando pedidos…</td></tr></tbody></table></div></section></main>
<script>
const body = document.querySelector("#orders");
const count = document.querySelector("#count");
const errorBox = document.querySelector("#error");
const money = new Intl.NumberFormat("es-CO", {style:"currency",currency:"COP",maximumFractionDigits:0});
let loaded = false;
// The alert region stays in the DOM and is only visible while it has text, so assistive tech can detect changes.
function showError(message) { errorBox.textContent = message; }
function clearError() { errorBox.textContent = ""; }
async function errorMessage(response) {
  try {
    const { error } = await response.json();
    if (typeof error === "string" && error) return error;
  } catch {}
  return "No se pudo actualizar el pedido. Inténtalo de nuevo.";
}
async function loadOrders() {
  try {
    const response = await fetch("/api/orders");
    if (!response.ok) throw new Error();
    const orders = await response.json();
    const rows = [];
    for (const order of orders) {
      const row = document.createElement("tr");
      for (const value of [order.id, order.customer, money.format(order.total)]) {
        const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
      }
      const status = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + order.status; badge.textContent = order.status;
      status.append(badge); row.append(status);
      const action = document.createElement("td");
      const button = document.createElement("button");
      button.textContent = "Marcar como enviado";
      button.disabled = order.status !== "pendiente";
      button.onclick = () => ship(order.id, button);
      action.append(button); row.append(action); rows.push(row);
    }
    count.textContent = orders.length + " pedidos";
    body.replaceChildren(...rows);
    loaded = true;
    return true;
  } catch {
    // Keep the table we already have if a refresh fails; only the first load needs the fallback row.
    if (!loaded) body.innerHTML = '<tr><td colspan="5">No se pudieron cargar los pedidos. Recarga la página.</td></tr>';
    return false;
  }
}
async function ship(id, button) {
  clearError();
  button.disabled = true;
  try {
    const response = await fetch(`/api/orders/${id}/ship`, {method:"POST"});
    if (response.ok) {
      if (!await loadOrders()) showError("El pedido se actualizó, pero no se pudo refrescar la lista. Recarga la página.");
      return;
    }
    showError(await errorMessage(response));
    // A 4xx is a final answer (the order cannot be shipped); only a server failure is worth retrying.
    if (!await loadOrders() && response.status >= 500) button.disabled = false;
  } catch {
    showError("No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.");
    button.disabled = false;
  }
}
loadOrders();
</script>
</body></html>
